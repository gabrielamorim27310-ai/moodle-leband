{% extends 'base.html' %}
{% block title %}Escolher Perfil — LEBand{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Bem-vindo ao LEBand!</h1>
        <p style="color:var(--text-light);text-align:center;margin-bottom:1.5rem;font-size:.9rem">
            Olá, <strong>{{ ms_data.name }}</strong>! Primeiro acesso via Microsoft.<br>Escolha seu perfil para continuar.
        </p>
        <form method="POST">
            <div class="role-selection">
                <label class="role-option">
                    <input type="radio" name="role" value="aluno" checked>
                    <div class="role-card">
                        <div style="font-size:2rem">🎒</div>
                        <strong>Aluno</strong>
                        <p>Acessar disciplinas e entregar trabalhos</p>
                    </div>
                </label>
                <label class="role-option">
                    <input type="radio" name="role" value="professor">
                    <div class="role-card">
                        <div style="font-size:2rem">👨‍🏫</div>
                        <strong>Professor</strong>
                        <p>Criar disciplinas e avaliar alunos</p>
                    </div>
                </label>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.5rem">Continuar</button>
        </form>
    </div>
</div>
{% endblock %}
