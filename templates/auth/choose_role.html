{% extends 'base.html' %}
{% block title %}Escolher Perfil - SaberFlow{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Bem-vindo ao SaberFlow!</h1>
        <p style="color:#64748b;text-align:center;margin-bottom:1.5rem">
            Olá, <strong>{{ ms_data.name }}</strong>! Como é a primeira vez que acessa pelo Microsoft,
            escolha seu perfil para continuar.
        </p>
        <form method="POST">
            <div class="role-selection">
                <label class="role-option">
                    <input type="radio" name="role" value="aluno" checked>
                    <div class="role-card">
                        <div style="font-size:2rem">🎒</div>
                        <strong>Aluno</strong>
                        <p>Acessar disciplinas, materiais e entregar trabalhos</p>
                    </div>
                </label>
                <label class="role-option">
                    <input type="radio" name="role" value="professor">
                    <div class="role-card">
                        <div style="font-size:2rem">👨‍🏫</div>
                        <strong>Professor</strong>
                        <p>Criar disciplinas, publicar materiais e avaliar</p>
                    </div>
                </label>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.5rem">Continuar</button>
        </form>
    </div>
</div>
{% endblock %}
