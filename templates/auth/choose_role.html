{% extends 'base.html' %}
{% block title %}Choose Your Role — LEBand{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>Welcome to LEBand!</h1>
        <p style="color:var(--text-light);text-align:center;margin-bottom:1.5rem;font-size:.9rem">
            Hello, <strong>{{ ms_data.name }}</strong>! First time signing in with Microsoft.<br>Choose your role to continue.
        </p>
        <form method="POST">
            <div class="role-selection">
                <label class="role-option">
                    <input type="radio" name="role" value="aluno" checked>
                    <div class="role-card">
                        <div style="font-size:2rem">🎒</div>
                        <strong>Student</strong>
                        <p>Access courses and submit assignments</p>
                    </div>
                </label>
                <label class="role-option">
                    <input type="radio" name="role" value="professor">
                    <div class="role-card">
                        <div style="font-size:2rem">👨‍🏫</div>
                        <strong>Teacher</strong>
                        <p>Create courses and grade students</p>
                    </div>
                </label>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:1.5rem">Continue</button>
        </form>
    </div>
</div>
{% endblock %}
