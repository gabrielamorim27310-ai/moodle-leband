{% extends 'base.html' %}
{% block title %}Entrar — LEBand{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:1.5rem">
            <img src="{{ url_for('static', filename='favicon.png') }}" alt="LEBand"
                 style="height:52px;width:52px;object-fit:contain">
            <span style="font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;color:var(--accent)">LEBand</span>
        </div>
        <h1 style="font-size:1.25rem;text-align:center;color:var(--text-light);font-family:'Inter',sans-serif;font-weight:500;margin-bottom:1.4rem">Acesse sua conta</h1>
        <a href="{{ url_for('auth.microsoft_login') }}" class="btn-microsoft" style="width:100%;margin-bottom:1.2rem;text-decoration:none;display:flex;align-items:center">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 21 21" style="margin-right:10px;flex-shrink:0">
                <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
            </svg>
            Entrar com Microsoft
        </a>
    </div>
</div>
{% endblock %}
