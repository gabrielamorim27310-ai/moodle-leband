{% extends 'base.html' %}
{% block title %}SSO not configured — LEBand{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align:center">
        <img src="{{ url_for('static', filename='favicon.png') }}" alt="LEBand"
             style="height:60px;width:60px;object-fit:contain;margin-bottom:1rem">
        <h1 style="font-size:1.3rem;color:var(--accent)">SSO not configured</h1>
        <p style="color:var(--text-light);font-size:.9rem;margin:1rem 0 1.5rem">
            Microsoft login has not been set up yet.<br>
            Add <code>MS_CLIENT_ID</code>, <code>MS_CLIENT_SECRET</code> and <code>MS_TENANT_ID</code> to your environment variables.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Go Back</a>
    </div>
</div>
{% endblock %}
