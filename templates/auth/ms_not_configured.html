{% extends 'base.html' %}
{% block title %}SSO não configurado — LEBand{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align:center">
        <img src="{{ url_for('static', filename='favicon.png') }}" alt="LEBand"
             style="height:60px;width:60px;object-fit:contain;margin-bottom:1rem">
        <h1 style="font-size:1.3rem;color:var(--accent)">SSO não configurado</h1>
        <p style="color:var(--text-light);font-size:.9rem;margin:1rem 0 1.5rem">
            O login com Microsoft ainda não foi configurado.<br>
            Adicione <code>MS_CLIENT_ID</code>, <code>MS_CLIENT_SECRET</code> e <code>MS_TENANT_ID</code> no arquivo <code>.env</code>.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-secondary">Voltar</a>
    </div>
</div>
{% endblock %}
